<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禁夜課程｜Rule & Discipline</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-red: #b30000;
            --gold: #d4af37;
            --bg-deep: #0a0a0a;
            --text-gray: #c0c0c0;
            --white-shirt: #ffffff;
            --font-serif: "Noto Serif TC", "Songti TC", "Apple LiSung", "微軟新細明體", "PMingLiU", serif;
        }

        body, html {
            margin: 0; padding: 0; width: 100%;
            background-color: var(--bg-deep);
            color: var(--text-gray);
            font-family: var(--font-serif);
            min-height: 100vh; /* 確保背景撐開 */
        }

        /* 背景雜訊層 */
        body::before {
            content: " "; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: -1; background-size: 100% 4px, 3px 100%; pointer-events: none;
        }

        .wrapper { 
            max-width: 600px; margin: 0 auto; padding: 40px 20px; 
            overflow-y: visible; /* 確保內容可滾動 */
        }
        
        .header { margin-bottom: 50px; }
        .header h2 { font-size: 0.9rem; color: var(--accent-red); letter-spacing: 5px; text-transform: uppercase; margin-bottom: 10px; }
        .header h1 { font-size: 2rem; font-weight: 900; color: var(--white-shirt); line-height: 1.2; margin: 0; }
        .sub-host { font-size: 1rem; color: var(--gold); margin-top: 10px; font-style: italic; }

        .section { margin-bottom: 40px; }
        .discipline-label { display: inline-block; background: var(--accent-red); color: white; padding: 2px 10px; font-size: 0.75rem; margin-bottom: 15px; font-weight: bold; letter-spacing: 1px; }
        .content-box { border-left: 2px solid var(--gold); padding-left: 15px; line-height: 1.7; font-size: 0.95rem; }

        .red-mark { position: relative; color: var(--white-shirt); font-weight: 700; }
        .red-mark::after { content: ""; position: absolute; bottom: 0; left: -2px; width: 105%; height: 6px; background: rgba(179, 0, 0, 0.4); z-index: -1; }

        .jk-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); padding: 20px; }

        .rsvp-container { text-align: center; margin: 50px 0; }
        .btn-confirmed { display: inline-block; padding: 18px 35px; border: 1px solid var(--gold); color: var(--gold); font-size: 1rem; font-weight: 700; letter-spacing: 3px; }
        .btn-confirmed::after { content: "● CONFIRMED ●"; display: block; font-size: 0.5rem; margin-top: 8px; opacity: 0.6; }
        
        a { color: var(--gold); text-decoration: underline; }
    </style>
</head>
<body>

    <div class="wrapper">
        <header class="header">
            <h2>Private Lesson: 001</h2>
            <h1>《Rule & Discipline》<br>禁夜課程</h1>
            <div class="sub-host">菟犽（feat. 牙）🐰🦷</div>
        </header>

        <section class="section">
            <span class="discipline-label">COURSE INTRO</span>
            <div class="content-box">
                我們的菟犽同學第一次舉辦私聚，邀請<span class="red-mark">最特別的你</span>參與。這是一場關於規則與放鬆的深夜實驗。
            </div>
        </section>

        <section class="section">
            <span class="discipline-label">SCHEDULE</span>
            <div class="content-box">
                <strong>DATE /</strong> 2026.05.29 - 30
