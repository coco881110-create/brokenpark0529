<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禁夜課程｜Rule & Discipline</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-red: #b30000;
            --gold: #d4af37;
            --bg-deep: #0a0a0a;
            --text-gray: #c0c0c0;
            --white-shirt: #ffffff;
            --font-serif: "Noto Serif TC", "Songti TC", "Apple LiSung", "微軟新細明體", "PMingLiU", serif;
        }

        body { margin: 0; background-color: var(--bg-deep); color: var(--text-gray); font-family: var(--font-serif); }

        .wrapper { max-width: 600px; margin: 0 auto; padding: 100px 30px; }

        /* --- 修正後的靜態按鈕與印章 --- */
        .rsvp-container { text-align: center; margin-top: 100px; position: relative; }
        
        .btn-obey {
            display: inline-block;
            padding: 20px 60px;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 3px;
            background: transparent;
            pointer-events: none; /* 禁止交互 */
            cursor: default;      /* 滑鼠不變手指 */
        }

        .stamp {
            position: absolute;
            bottom: -30px;
            right: 20px;
            width: 120px;
            height: 120px;
            border: 3px double var(--accent-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-red);
            font-weight: 900;
            font-size: 0.9rem;
            transform: rotate(-15deg);
            background: rgba(179, 0, 0, 0.1);
            z-index: 20;
        }

        .stamp::before { content: "確"; display: block; font-size: 2rem; }
    </style>
</head>
<body>

    <div class="wrapper">
        <header class="header">
            <h1>《Rule & Discipline》<br>禁夜課程</h1>
        </header>

        <div class="rsvp-container">
            <div class="btn-obey">
                已登錄・准許入座
                <div style="position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #0a0a0a; padding: 0 10px; font-size: 0.7rem; color: #d4af37;">
                    CONFIRMED
                </div>
            </div>
            <div class="stamp">定入場</div>
        </div>
    </div>

</body>
</html>
